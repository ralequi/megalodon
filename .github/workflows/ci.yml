name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: megalodon
          POSTGRES_USER: megalodon
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U megalodon -d megalodon" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      POSTGRES_DB: megalodon
      POSTGRES_USER: megalodon
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest
